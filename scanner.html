<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner QR Funwalk</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f3f5f8;color:#24364b}.wrap{max-width:620px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 3px 14px #0001}h1{font-size:22px;color:#a71920;margin:0 0 6px}.muted{font-size:13px;color:#64748b;line-height:1.5}#reader{width:100%;overflow:hidden;border-radius:12px;margin-top:12px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#a71920;color:white;font-size:16px;font-weight:bold;margin-top:10px}button.secondary{background:#e9edf2;color:#24364b}#status{padding:12px;border-radius:10px;background:#f1f5f9;margin-top:12px;line-height:1.45;font-size:14px}#status.ok{background:#dcfce7;color:#166534}#status.bad{background:#fee2e2;color:#991b1b}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head><body><main class="wrap"><section class="card"><h1>FUNWALK 2026</h1><div class="muted">Scanner kamera langsung • Halaman aman HTTPS</div><div id="reader"></div><button id="start">Mulai Kamera Belakang</button><button id="stop" class="secondary">Hentikan Kamera</button><div id="status">Tekan “Mulai Kamera Belakang”, izinkan akses kamera, lalu arahkan QR peserta ke kamera.</div></section><section class="card muted">Setelah QR terbaca, token akan dikirim ke halaman sistem Funwalk yang membuka scanner ini. Jangan tutup halaman sistem utama.</section></main>
<script>
let qr=null,starting=false,done=false;
const statusEl=document.getElementById('status');
function status(msg,kind=''){statusEl.textContent=msg;statusEl.className=kind;}
function tokenFrom(raw){let v=String(raw||'').trim();if(!v)return '';try{if(/^https?:\/\//i.test(v)){const u=new URL(v);const p=u.searchParams.get('token')||u.searchParams.get('text')||u.searchParams.get('data');if(p)return p.trim();}}catch(e){}v=v.replace(/^FUNWALK[:=]/i,'').trim();return v.includes('|')?v.split('|').pop().trim():v;}
async function start(){if(starting||qr)return;starting=true;done=false;document.getElementById('start').disabled=true;try{if(!window.isSecureContext)throw new Error('Halaman ini harus dibuka melalui HTTPS.');if(!navigator.mediaDevices?.getUserMedia)throw new Error('Browser tidak mendukung akses kamera. Buka langsung di Chrome.');if(typeof Html5Qrcode==='undefined')throw new Error('Library scanner gagal dimuat. Periksa koneksi internet.');qr=new Html5Qrcode('reader',{verbose:false});const cams=await Html5Qrcode.getCameras();if(!cams.length)throw new Error('Kamera tidak ditemukan.');const back=cams.find(c=>/back|rear|environment|belakang/i.test(c.label))||cams[cams.length-1];await qr.start(back.id,{fps:12,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*.72);return {width:s,height:s};},aspectRatio:1},async decoded=>{if(done)return;const token=tokenFrom(decoded);if(!token){status('QR terbaca tetapi token kosong. Coba arahkan ulang.','bad');return;}done=true;status('QR terbaca. Mengirim token ke sistem Funwalk…','ok');try{await qr.stop();qr.clear();}catch(e){}qr=null;if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'FUNWALK_QR_TOKEN',token},'*');status('Token terkirim. Kembali ke tab sistem Funwalk untuk melihat hasil validasi.','ok');setTimeout(()=>window.close(),900);}else{status('Halaman sistem utama tidak ditemukan. Tutup scanner, kembali ke sistem Funwalk, lalu tekan Mulai Scan lagi.','bad');done=false;}});status('Kamera aktif. Arahkan QR peserta ke kamera.','ok');}catch(e){if(qr){try{await qr.stop();}catch(_){}try{qr.clear();}catch(_){}qr=null;}status('Kamera gagal dibuka: '+(e.message||e)+'. Periksa izin Kamera untuk situs GitHub Pages ini, lalu muat ulang.','bad');}finally{starting=false;document.getElementById('start').disabled=false;}}
async function stop(){if(!qr){status('Kamera sedang tidak aktif.');return;}try{await qr.stop();qr.clear();qr=null;status('Kamera dihentikan.');}catch(e){status('Gagal menghentikan kamera: '+e.message,'bad');qr=null;}}
document.getElementById('start').addEventListener('click',start);document.getElementById('stop').addEventListener('click',stop);
</script></body></html>
